{% extends 'base.html' %}

{% block title %}Log In - AI Code Reviewer{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="glass-card auth-card">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Log in to submit code and view your history.</p>
        </div>

        <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-with-icon">
                    <i class="ph ph-envelope"></i>
                    <input type="email" id="email" name="email" required placeholder="you@example.com">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-icon">
                    <i class="ph ph-lock-key"></i>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
            </div>

            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox" name="remember">
                    <span class="checkmark"></span>
                    Remember me
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-large mt-4">Log In</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="{{ url_for('register') }}" class="text-link">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
